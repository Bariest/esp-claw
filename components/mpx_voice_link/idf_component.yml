## The Opus wrappers used by the reference firmware for this board.
##
## 78/esp-opus-encoder is the xiaozhi author's component: libopus plus thin
## C++ wrappers (OpusEncoderWrapper, OpusDecoderWrapper, OpusResampler).
## Matching it matters because the far end of this socket is a xiaozhi server
## that expects exactly the framing this library produces.
dependencies:
  78/esp-opus-encoder: "~2.4.0"
