## IDF Component Manager Manifest File
##
## ESP-Claw lives in the git submodule at third-party/esp-claw and is pulled in
## component-by-component with `path:` dependencies -- the same mechanism
## esp-mosaico-claw uses. Nothing here uses EXTRA_COMPONENT_DIRS, and no file
## inside the submodule is ever edited, so bumping the pin is a submodule
## checkout rather than a merge.
##
##   rules:   hard requirement, gated on Kconfig (dep is absent otherwise)
##   matches: optional inclusion when the condition holds
dependencies:
  espressif/esp_board_manager:
    version: "^0.6"
    public: true

  espressif/ramfs:
    version: "^0.1"

  # ---- ESP-Claw (submodule, pinned) ------------------------------------
  app_claw:
    path: ../third-party/esp-claw/components/common/app_claw

  captive_dns:
    path: ../third-party/esp-claw/components/common/captive_dns

  claw_utils:
    path: ../third-party/esp-claw/components/claw_modules/claw_utils

  http_reuse:
    path: ../third-party/esp-claw/components/common/http_reuse

  settings:
    path: ../third-party/esp-claw/components/common/settings

  wifi_manager:
    path: ../third-party/esp-claw/components/common/wifi_manager

  system_ui:
    rules:
    - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True
    path: ../third-party/esp-claw/components/common/system_ui

  esp_video:
    path: ../third-party/esp-claw/components/common/esp_video
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True

  # ---- Product-owned components ----------------------------------------
  app_config:
    path: ../components/app_config

  http_server:
    path: ../components/http_server

  cmd_wifi:
    path: ../components/cmd_wifi

  # ---- The quadruped ----------------------------------------------------
  mpx_robot:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_robot

  mpx_util:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_util

  mpx_wasm:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_wasm

  # ---- Robot capability groups ------------------------------------------
  # Registered from app_main through app_capabilities_register_external_group(),
  # which is the one extension point a downstream ESP-Claw product actually
  # needs. Nothing in app_claw is edited.
  cap_robot:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/cap_robot

  cap_mpx_skill:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/cap_mpx_skill

  cap_display:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True
    path: ../components/cap_display

  # The `selftest` console command. Declared here like every other local
  # component: main only reaches a component's headers through a dependency,
  # and dropping a new directory into components/ does not always make CMake
  # reconfigure, so relying on auto-discovery fails in a way that looks like a
  # missing file.
  mpx_selftest:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_selftest

  # Microphone and speaker: recording, playback and the `audio` console
  # command. Phase 1 of docs/voice-plan.md. Present whenever the board
  # declares audio devices, and harmless when it does not -- every entry
  # point returns ESP_ERR_NOT_SUPPORTED with no codec.
  mpx_audio:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_audio

  # Opus, and later the WebSocket to the voice server. Phase 2 of
  # docs/voice-plan.md.
  mpx_voice_link:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_voice_link

  # Acoustic front end, WakeNet and MultiNet. Large: it brings esp-dl and
  # esp-dsp with it, and the first build downloads several hundred MB.
  espressif/esp-sr:
    version: "^2.5.2"
    rules:
      - if: $CONFIG{MP4_VOICE_ENABLE} == True
