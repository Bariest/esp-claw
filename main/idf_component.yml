## IDF Component Manager Manifest File
##
## ESP-Claw lives in the git submodule at third-party/esp-claw and is pulled in
## component-by-component with `path:` dependencies -- the same mechanism
## esp-mosaico-claw uses. Nothing here uses EXTRA_COMPONENT_DIRS, and no file
## inside the submodule is ever edited, so bumping the pin is a submodule
## checkout rather than a merge.
##
##   rules:   hard requirement, gated on Kconfig (dep is absent otherwise)
##   matches: optional inclusion when the condition holds
dependencies:
  espressif/esp_board_manager:
    version: "^0.6"
    public: true

  espressif/ramfs:
    version: "^0.1"

  # ---- ESP-Claw (submodule, pinned) ------------------------------------
  app_claw:
    path: ../third-party/esp-claw/components/common/app_claw

  captive_dns:
    path: ../third-party/esp-claw/components/common/captive_dns

  claw_utils:
    path: ../third-party/esp-claw/components/claw_modules/claw_utils

  http_reuse:
    path: ../third-party/esp-claw/components/common/http_reuse

  settings:
    path: ../third-party/esp-claw/components/common/settings

  wifi_manager:
    path: ../third-party/esp-claw/components/common/wifi_manager

  system_ui:
    rules:
    - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True
    path: ../third-party/esp-claw/components/common/system_ui

  esp_video:
    path: ../third-party/esp-claw/components/common/esp_video
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True

  # ---- Product-owned components ----------------------------------------
  app_config:
    path: ../components/app_config

  http_server:
    path: ../components/http_server

  cmd_wifi:
    path: ../components/cmd_wifi

  # ---- The quadruped ----------------------------------------------------
  mpx_robot:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_robot

  mpx_util:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_util

  mpx_wasm:
    rules:
    - if: $CONFIG{MP4_ROBOT_ENABLE} == True
    path: ../components/mpx_wasm
